# Copy this folder to agents/<your-agent-name>/ and replace every "my-agent" (here and in kustomization.yaml).
apiVersion: kisz.ai/v1
name: my-agent
description: One sentence on what this agent does.
model: qwen3-8-27b
max_turns: 8
teams:
  - kisz-internal
# MCP servers come from LiteLLM: an admin adds them to this access group.
mcp_access_groups:
  - my-agent
skills: []
skills_loading: all
slack:
  default: false
  channels: []
  listen: mentions
  dm: true
