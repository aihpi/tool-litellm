name: Rebase aihpi-provider onto upstream main

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  rebase:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: aihpi-provider
          fetch-depth: 0

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch upstream main

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Rebase onto upstream/main
        run: |
          git checkout aihpi-provider
          git rebase upstream/main

      - name: Push rebased branch
        run: |
          git push origin aihpi-provider --force-with-lease

      - name: Trigger build-and-publish workflow
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-and-publish.yaml",
              ref: "aihpi-provider",
            });

      - name: Collect conflict files
        if: failure()
        id: conflicts
        run: |
          files=$(git status --porcelain | awk '$1 ~ /U/ {print $2}' | sort -u)
          if [ -z "$files" ]; then
            files="(no conflicted files detected; check the workflow logs)"
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue on conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const files = `${{ steps.conflicts.outputs.files }}`;
            const title = `Rebase conflict: aihpi-provider onto upstream/main (run ${context.runId})`;
            const body = [
              "The scheduled rebase failed due to conflicts.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Conflicted files:",
              "```",
              files,
              "```",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
