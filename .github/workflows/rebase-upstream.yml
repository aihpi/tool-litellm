name: Merge upstream litellm_internal_staging into aihpi-provider

on:
  workflow_dispatch:
  schedule:
    - cron: "0 3 * * *"

permissions:
  contents: write
  issues: write
  actions: write

jobs:
  merge-upstream:
    runs-on: ubuntu-latest
    steps:
      # A PAT with the `workflow` scope is required. The default GITHUB_TOKEN is
      # refused by the API whenever a push creates or updates anything under
      # .github/workflows/, which happens every time upstream touches their CI.
      - name: Check merge token is configured
        env:
          MERGE_TOKEN: ${{ secrets.UPSTREAM_MERGE_TOKEN }}
        run: |
          if [ -z "$MERGE_TOKEN" ]; then
            echo "ERROR: secret UPSTREAM_MERGE_TOKEN is not set." >&2
            echo "Create a PAT with 'repo' + 'workflow' scope and add it as that" >&2
            echo "secret, otherwise pushes fail whenever upstream changes a workflow." >&2
            exit 1
          fi

      - name: Checkout fork branch
        uses: actions/checkout@v4
        with:
          ref: aihpi-provider
          fetch-depth: 0
          token: ${{ secrets.UPSTREAM_MERGE_TOKEN }}
          persist-credentials: true

      - name: Add upstream and fetch
        run: |
          git remote add upstream https://github.com/BerriAI/litellm.git
          git fetch upstream litellm_internal_staging

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Check if upstream has new commits
        id: check
        run: |
          ahead=$(git rev-list --count aihpi-provider..upstream/litellm_internal_staging)
          echo "ahead=$ahead" >> "$GITHUB_OUTPUT"
          if [ "$ahead" -eq 0 ]; then
            echo "No new upstream commits, skipping merge"
          else
            echo "$ahead new upstream commits to merge"
          fi

      - name: Merge upstream
        if: steps.check.outputs.ahead != '0'
        id: merge
        run: |
          if git merge upstream/litellm_internal_staging --no-edit; then
            echo "status=clean" >> "$GITHUB_OUTPUT"
          else
            echo "status=conflicts" >> "$GITHUB_OUTPUT"
          fi

      - name: Auto-resolve build artifact conflicts
        if: steps.merge.outputs.status == 'conflicts'
        run: |
          # Build artifacts: we deleted them (gitignored), upstream modified them.
          # Resolution: delete them (they're rebuilt at Docker build time).
          artifact_conflicts=$(git diff --name-only --diff-filter=U | grep "^litellm/proxy/_experimental/out/" || true)
          if [ -n "$artifact_conflicts" ]; then
            echo "Auto-resolving $(echo "$artifact_conflicts" | wc -l) build artifact conflicts"
            echo "$artifact_conflicts" | xargs git rm -f --quiet 2>/dev/null || true
          fi

          # Also accept any new upstream files in _experimental/out/ that
          # were added (not conflicted) and delete them too
          git ls-files --others -- litellm/proxy/_experimental/out/ | xargs rm -f 2>/dev/null || true

          # Check if any real conflicts remain
          remaining=$(git diff --name-only --diff-filter=U || true)
          if [ -z "$remaining" ]; then
            echo "All conflicts were build artifacts, resolved by deletion"
            echo "remaining=none" >> "$GITHUB_OUTPUT"
          else
            echo "Real conflicts remain:"
            echo "$remaining"
            echo "remaining=some" >> "$GITHUB_OUTPUT"
          fi
        id: artifact_resolve

      - name: Resolve remaining conflicts with LLM
        if: steps.merge.outputs.status == 'conflicts' && steps.artifact_resolve.outputs.remaining == 'some'
        env:
          LITELLM_API_KEY: ${{ secrets.LITELLM_API_KEY }}
        run: |
          conflicted=$(git diff --name-only --diff-filter=U)
          if [ -z "$conflicted" ]; then
            echo "No conflicted files found"
            exit 1
          fi

          echo "Conflicted files:"
          echo "$conflicted"

          resolved_all=true
          for file in $conflicted; do
            echo "--- Resolving: $file ---"

            response=$(python3 -c "
          import json, sys, urllib.request, os

          conflict = open('$file').read()

          prompt = '''You are resolving a git merge conflict in a litellm fork.

          This fork adds Authentik SSO support to litellm. The fork's changes should be preserved alongside upstream's changes. Both sides' code should be kept -- upstream is adding/changing their features, and the fork is adding Authentik SSO on top.

          Rules:
          - Keep ALL upstream changes (theirs)
          - Keep ALL fork Authentik SSO additions (ours)
          - Remove all conflict markers (<<<<<<, ======, >>>>>>)
          - Output ONLY the resolved file content, no explanation, no markdown fences

          Here is the file with conflict markers:

          ''' + conflict

          api_base = 'https://api.aisc.hpi.de'
          req = urllib.request.Request(
              f'{api_base}/v1/chat/completions',
              data=json.dumps({
                  'model': 'gemma-4-31b',
                  'messages': [{'role': 'user', 'content': prompt}],
                  'max_tokens': 16000,
                  'temperature': 0,
              }).encode(),
              headers={
                  'Authorization': f\"Bearer {os.environ['LITELLM_API_KEY']}\",
                  'Content-Type': 'application/json',
              },
          )
          resp = json.load(urllib.request.urlopen(req, timeout=120))
          text = resp['choices'][0]['message']['content']

          # Strip markdown fences if the model wrapped the output
          lines = text.split('\n')
          if lines and lines[0].startswith('\`\`\`'):
              lines = lines[1:]
          if lines and lines[-1].strip() == '\`\`\`':
              lines = lines[:-1]
          print('\n'.join(lines))
          ")

            if [ $? -eq 0 ]; then
              echo "$response" > "$file"
              git add "$file"
              echo "Resolved: $file"
            else
              echo "Failed to resolve: $file"
              resolved_all=false
            fi
          done

          if [ "$resolved_all" = true ]; then
            echo "All conflicts resolved by LLM"
          else
            echo "Some conflicts could not be resolved"
            exit 1
          fi

      - name: Commit merge resolution
        if: steps.merge.outputs.status == 'conflicts'
        run: |
          git commit --no-edit -m "chore: merge upstream litellm_internal_staging (auto-resolved)"

      # aihpi/manifest.txt lists whole-file copies that apply.sh writes over upstream's
      # versions at build time. When upstream edits one of those files the copy goes
      # stale, and apply.sh refuses to run rather than discard their work. Doing the
      # 3-way merge here, before the push, keeps the branch buildable instead of
      # landing a merge that fails later in build-and-publish. Deterministic
      # git merge-file, not the LLM above: the base is exact and this is auth code.
      - name: Re-sync whole-file copies onto upstream
        if: steps.check.outputs.ahead != '0'
        run: |
          while IFS=$'\t' read -r ours upstream_path; do
            case "$ours" in \#*|"") continue ;; esac
            copy="aihpi/$ours"
            read -r recorded_sha recorded_blob < <(awk -F'\t' -v n="$ours" '$3 == n {print $1, $2}' aihpi/baseline.sha256)
            if [ "$(shasum -a 256 "$upstream_path" | awk '{print $1}')" = "$recorded_sha" ]; then
              echo "$ours: upstream unchanged"
              continue
            fi

            echo "$ours: upstream moved, 3-way merging our additions onto their version"
            base=$(mktemp)
            git cat-file blob "$recorded_blob" > "$base"
            if ! git merge-file -L ours -L baseline -L upstream "$copy" "$base" "$upstream_path"; then
              echo "ERROR: could not re-sync $copy onto $upstream_path without conflicts." >&2
              echo "Resolve the markers by hand, then run: bash aihpi/rebaseline.sh" >&2
              exit 1
            fi
          done < aihpi/manifest.txt

          if git diff --quiet -- aihpi; then
            echo "All copies still match their baseline"
            exit 0
          fi

          bash aihpi/rebaseline.sh
          git add aihpi
          git commit -m "chore(aihpi): re-sync whole-file copies onto upstream's new versions"

      - name: Push merged branch
        if: steps.check.outputs.ahead != '0'
        run: |
          git push origin aihpi-provider

      - name: Trigger build-and-publish workflow
        if: steps.check.outputs.ahead != '0'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "build-and-publish.yaml",
              ref: "aihpi-provider",
            });

      - name: Collect conflict files
        if: failure()
        id: conflicts
        run: |
          files=$(git diff --name-only --diff-filter=U 2>/dev/null | sort -u)
          if [ -z "$files" ]; then
            files="(conflict resolution failed; check the workflow logs)"
          fi
          {
            echo "files<<EOF"
            echo "$files"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Create issue on unresolved conflict
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const runUrl = `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const files = `${{ steps.conflicts.outputs.files }}`;
            const title = `Merge conflict: upstream into aihpi-provider (run ${context.runId})`;
            const body = [
              "The scheduled upstream merge had conflicts that Claude could not resolve automatically.",
              "",
              `Workflow run: ${runUrl}`,
              "",
              "Conflicted files:",
              "```",
              files,
              "```",
            ].join("\n");
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title,
              body,
            });
