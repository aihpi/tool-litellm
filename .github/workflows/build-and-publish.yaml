name: Build and Publish Docker Image

on:
  push:
    branches:
      - main
      - master
      - aihpi-provider
      - dev/*
    paths-ignore:
      - ".github/workflows/**"
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
      - aihpi-provider
      - dev/*
  workflow_dispatch:

# The upstream-merge workflow pushes with a PAT (which triggers this on push)
# and also dispatches it explicitly, so the same commit can arrive twice. Keep
# the newest run per ref and cancel the older one.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply HPI branding
        run: bash aihpi/branding/apply.sh

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=dev,enable=${{ startsWith(github.ref_name, 'dev/') }}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix={{branch}}-

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          no-cache: true
          platforms: linux/amd64

      - name: Generate image URL
        run: |
          echo "## Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Image: \`${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Pull command:" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`bash" >> $GITHUB_STEP_SUMMARY
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

  # Turns "it compiled" into "it boots and our patches are in it". The build
  # cannot catch a Python import error in the patched Authentik copies, because
  # nothing imports them until the proxy starts.
  smoke-test:
    runs-on: ubuntu-latest
    needs: build-and-push
    permissions:
      contents: read
      packages: read

    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: llm
          POSTGRES_PASSWORD: llm
          POSTGRES_DB: litellm
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5432:5432

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # By digest, not by tag: this must test the artifact this run produced,
      # not whatever the branch tag points at by the time we pull.
      - name: Start the image this run built
        run: |
          docker run -d --name proxy --network host \
            -e LITELLM_MASTER_KEY=sk-smoke \
            -e DATABASE_URL=postgresql://llm:llm@localhost:5432/litellm \
            -e LITELLM_WORKER_STARTUP_HOOKS=litellm.aihpi:register \
            -e DOCS_URL=/docs \
            -e ROOT_REDIRECT_URL=/ui \
            -e LITELLM_HIDE_DEFAULT_CREDENTIALS_HINT=true \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.digest }}" \
            --port 4000

      - name: Wait for the proxy to become ready
        run: |
          for _ in $(seq 1 60); do
            if [ "$(curl -fsS -o /dev/null -w '%{http_code}' http://localhost:4000/health/readiness || true)" = "200" ]; then
              echo "ready"
              exit 0
            fi
            if ! docker ps -q -f name=proxy -f status=running | grep -q .; then
              echo "::error::container exited during startup"
              break
            fi
            sleep 3
          done
          echo "::error::proxy never became ready"
          docker logs proxy 2>&1 | tail -60
          exit 1

      - name: Assert the fork's patches are live
        run: |
          fail=0
          check() {  # name expected actual
            if [ "$2" = "$3" ]; then
              echo "ok   $1 ($3)"
            else
              echo "::error::$1 expected $2, got $3"
              fail=1
            fi
          }

          # 307 proves the startup hook ran, which is what registers aihpi-provider
          check "/favicon.ico"  307 "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/favicon.ico)"
          check "/ -> /ui"      307 "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/)"
          check "/docs"         200 "$(curl -s -o /dev/null -w '%{http_code}' http://localhost:4000/docs)"

          # -L because next.config sets trailingSlash, so /ui/login 307s to /ui/login/
          if curl -fsSL http://localhost:4000/ui/login | grep -q "AI Model Hub"; then
            echo "ok   branding applied to login page"
          else
            echo "::error::login page is missing the HPI branding"
            fail=1
          fi

          exit $fail

      # Asserted with the image's own interpreter rather than pytest: the venv is
      # built by uv with pip stripped, and this way the checks run against the
      # provider as actually shipped.
      - name: Assert the provider logic in the shipped artifact
        run: |
          docker exec -i proxy /app/.venv/bin/python - <<'PY'
          from litellm.aihpi.provider import (
              _embedding_request,
              _parse_embedding_response,
              _parse_image_input,
          )
          from litellm.llms.custom_llm import CustomLLMError

          assert _parse_image_input(["https://x/i.png"]) == [{"image_url": "https://x/i.png"}]
          assert _parse_image_input(["data:image/png;base64,AAA"]) == [{"image_base64": "AAA"}]

          for bad, expected in ((["hello"], "Text-only"), ([], "At least one image")):
              try:
                  _parse_image_input(bad)
              except ValueError as exc:
                  assert expected in str(exc), exc
              else:
                  raise AssertionError(f"expected ValueError for {bad!r}")

          parsed = _parse_embedding_response("m", {"embeddings": [[0.1, 0.2]]})
          assert parsed.model == "m" and parsed.data[0]["embedding"] == [0.1, 0.2]

          try:
              _parse_embedding_response("m", {"nope": 1})
          except CustomLLMError:
              pass
          else:
              raise AssertionError("expected CustomLLMError on a malformed response")

          url, headers, _ = _embedding_request("m", ["https://x/i.png"], "k", "https://api/", {})
          assert url == "https://api/v1/embeddings", url
          assert headers["Authorization"] == "Bearer k"

          print("provider logic OK")
          PY

      - name: Container logs on failure
        if: failure()
        run: docker logs proxy 2>&1 | tail -100

  cleanup-dev-images:
    runs-on: ubuntu-latest
    needs: build-and-push
    if: github.event_name == 'push' && contains(fromJson('["main","master","aihpi-provider"]'), github.ref_name)
    permissions:
      packages: write
      contents: read
    steps:
      - name: Delete dev-tagged images
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const packageName = context.repo.repo;
            const isOrg = context.payload.repository.owner.type === "Organization";
            const listEndpoint = isOrg
              ? "GET /orgs/{org}/packages/container/{package_name}/versions"
              : "GET /users/{username}/packages/container/{package_name}/versions";
            const params = isOrg
              ? { org: owner, package_name: packageName, per_page: 100 }
              : { username: owner, package_name: packageName, per_page: 100 };

            const versions = await github.paginate(listEndpoint, params);
            const devTagRegex = /^dev([/-].*)?$/;

            for (const version of versions) {
              const tags = version.metadata?.container?.tags || [];
              if (tags.length === 0) continue;

              const allDev = tags.every((tag) => devTagRegex.test(tag));
              if (!allDev) continue;

              const deleteEndpoint = isOrg
                ? "DELETE /orgs/{org}/packages/container/{package_name}/versions/{package_version_id}"
                : "DELETE /users/{username}/packages/container/{package_name}/versions/{package_version_id}";
              const deleteParams = isOrg
                ? { org: owner, package_name: packageName, package_version_id: version.id }
                : { username: owner, package_name: packageName, package_version_id: version.id };

              core.info(`Deleting ${packageName} version ${version.id} with tags: ${tags.join(", ")}`);
              await github.request(deleteEndpoint, deleteParams);
            }

  # Records the freshly-smoke-tested image in the deploy repo. Deliberately
  # gated on smoke-test, not just the build: a green docker build proves the
  # image compiled, not that it boots, and we have shipped an image that failed
  # at import time. Pinning a digest that cannot start would be worse than not
  # pinning at all.
  #
  # This does not deploy. litellm-k8s has no gitops controller; someone still
  # runs scripts/deploy.sh. The bump records the intended version so nobody has
  # to copy a digest by hand.
  bump-deploy-manifest:
    runs-on: ubuntu-latest
    needs: [build-and-push, smoke-test]
    if: github.event_name == 'push' && github.ref_name == 'aihpi-provider'

    steps:
      # Cross-repo push, so the per-repo GITHUB_TOKEN cannot do it. Needs a PAT
      # (ideally fine-grained, contents:write on aihpi/litellm-k8s only).
      - name: Check deploy token is configured
        env:
          DEPLOY_TOKEN: ${{ secrets.K8S_REPO_TOKEN }}
        run: |
          if [ -z "$DEPLOY_TOKEN" ]; then
            echo "ERROR: secret K8S_REPO_TOKEN is not set." >&2
            echo "Create a PAT with contents:write on aihpi/litellm-k8s and add it" >&2
            echo "as that secret. GITHUB_TOKEN is scoped to this repo and cannot push there." >&2
            exit 1
          fi

      - name: Checkout deploy repo
        uses: actions/checkout@v4
        with:
          repository: aihpi/litellm-k8s
          ref: main
          token: ${{ secrets.K8S_REPO_TOKEN }}
          persist-credentials: true

      - name: Pin the new digest
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          python3 - <<'PY'
          import os
          import re

          path = "overlays/prod/kustomization.yaml"
          digest = os.environ["DIGEST"]
          if not digest.startswith("sha256:"):
              raise SystemExit(f"ERROR: unexpected digest {digest!r} from the build job")

          src = open(path).read()
          # Anchored on the image name so a restructured images: block fails here
          # rather than silently pinning nothing.
          pattern = re.compile(
              r"(- name: ghcr\.io/aihpi/tool-litellm\n\s*digest: )sha256:[0-9a-f]{64}"
          )
          src, n = pattern.subn(lambda m: m.group(1) + digest, src, count=1)
          if n == 1:
              pinned = src
          elif re.search(r"^images:", src, re.M):
              raise SystemExit(
                  f"ERROR: {path} has an images: block without a tool-litellm pin; "
                  "update this workflow's anchor"
              )
          else:
              pinned = src.rstrip("\n") + (
                  f"\n\nimages:\n  - name: ghcr.io/aihpi/tool-litellm\n    digest: {digest}\n"
              )
          open(path, "w").write(pinned)
          print(f"pinned {digest}")
          PY

      - name: Commit and push the bump
        env:
          DIGEST: ${{ needs.build-and-push.outputs.digest }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --exit-code overlays/prod/kustomization.yaml; then
            echo "Digest unchanged, nothing to commit."
            exit 0
          fi

          git add overlays/prod/kustomization.yaml
          git commit -m "chore: pin litellm proxy to ${DIGEST} from ${GITHUB_REPOSITORY}@${GITHUB_SHA}"

          # Another run can land between our checkout and our push. Rebase onto
          # whatever arrived and retry, capped so a broken main cannot loop.
          for attempt in 1 2 3 4 5; do
            if git push origin main; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt), rebasing."
            git pull --rebase origin main
          done
          echo "Failed to push after 5 attempts." >&2
          exit 1
